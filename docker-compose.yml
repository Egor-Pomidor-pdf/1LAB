# PostgreSQL для лабораторных по базам данных.
# Запуск:      docker compose up -d
# Консоль:     docker compose exec db psql -U student -d labs
# Скрипт лабы: docker compose exec db psql -U student -d labs -f /labs/lab1/schema.sql
services:
  db:
    image: postgres:17
    container_name: db-lab1-postgres
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: labs
    ports:
      # 5432 на хосте занят локально установленным PostgreSQL,
      # поэтому наружу контейнер смотрит портом 5433
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/labs:ro
    restart: unless-stopped

volumes:
  pgdata:
